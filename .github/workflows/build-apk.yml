name: APK yig
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK hazirla
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: APK yig
        run: gradle assembleDebug --no-daemon
      - name: Release-e yukle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KerpicBlok.apk
          cp kart/build/outputs/apk/debug/kart-debug.apk KartOyunlari.apk
          cp krossvord/build/outputs/apk/debug/krossvord-debug.apk Krossvord.apk
          gh release create "v2.${{ github.run_number }}" KerpicBlok.apk KartOyunlari.apk Krossvord.apk --title "Oyunlar v2.${{ github.run_number }}" --notes "Kerpic Blok, Kart Oyunlari, Krossvord" --latest
